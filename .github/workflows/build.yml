name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Dylib for iOS (arm64)
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -dynamiclib main.mm -o libRobloxNeon.dylib -framework UIKit -framework WebKit -framework Foundation -framework QuartzCore
        echo "Compilation completed successfully!"

    - name: Upload compiled Dylib
      uses: actions/upload-artifact@v4
      with:
        name: RobloxNeonDylib
        path: libRobloxNeon.dylib
